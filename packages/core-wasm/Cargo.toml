[package]
name = "core-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM core engine for CyberEdu Zero-Trust Academy"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4.3"
base64 = "0.21.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
aes = "0.8.4"
aes-gcm = "0.10.3"
rsa = "0.9.6"
rand = "0.8.5"
regex = "1.10.4"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
time = "0.3.36"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
